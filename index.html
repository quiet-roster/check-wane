<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E151F">
<meta name="color-scheme" content="dark">
<title>ตารางเวรอาจารย์ 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0E151F; --panel:#151F2C; --panel-2:#1B2838; --raise:#223248;
  --line:#26374C; --line-soft:#1C2939;
  --text:#E9EFF7; --muted:#9DB0C6; --dim:#6E839C;
  --focus:#7DD3FC;
  /* semantic categories */
  --paid:#2DD4BF; --paid-ink:#7CEBDD; --paid-bg:rgba(45,212,191,.14);
  --routine:#FB923C; --routine-ink:#FDBA74; --routine-bg:rgba(251,146,60,.15);
  --neutral:#94A3B8;
  /* buckets */
  --b-siphd:#38BDF8; --b-siphn:#818CF8; --b-other:#2DD4BF; --b-siriraj:#FB923C; --b-cont:#FCD34D;
  --off:#F5A3B7;
  --r-lg:14px; --r:10px; --r-sm:7px;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --disp:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --navh:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(150px + env(safe-area-inset-top,0px))}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.mast{padding:calc(18px + env(safe-area-inset-top,0px)) 0 12px}
.mast h1{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.15;margin:0;letter-spacing:-.01em}
.mast p{margin:3px 0 0;font-size:13px;color:var(--muted)}

/* ---------- sticky context bar ---------- */
.ctx{position:sticky;top:0;z-index:30;background:rgba(14,21,31,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px}
.ctx .wrap{display:flex;flex-direction:column;gap:8px}

/* combobox */
.combo{position:relative}
.combo-field{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:0 6px 0 12px;min-height:46px;transition:border-color .15s}
.combo-field:focus-within{border-color:var(--focus)}
.combo-field svg{flex:none;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.combo input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;padding:10px 0}
.combo input::placeholder{color:var(--dim)}
.combo-clear{flex:none;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:18px;line-height:1}
.combo-clear:hover{background:var(--panel-2);color:var(--text)}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r);max-height:min(52vh,380px);overflow-y:auto;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6);padding:4px;margin:0;list-style:none}
.combo-list li{padding:11px 12px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.combo-list li[aria-selected="true"]{background:var(--raise)}
.combo-list li small{color:var(--muted);font-size:12px}
.combo-list .grp{padding:8px 12px 4px;font-size:12px;color:var(--muted);cursor:default}
.combo-list .none{color:var(--muted);cursor:default}

/* period chips */
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:1px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding-left:16px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:14px;font-weight:500;padding:0 14px;min-height:38px;border-radius:999px;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text);font-weight:600}
.chip .x{margin-left:6px;opacity:.7}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(17,26,38,.97);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);height:var(--navh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;
  position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 2px 2px;background:var(--paid)}

/* ---------- surfaces ---------- */
main{padding-top:14px}
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-family:var(--disp);font-size:18px;font-weight:700;margin:0;letter-spacing:-.005em}
.sec-h .aside{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pad{padding:14px 16px}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--disp);color:var(--text);font-size:18px;margin:0 0 6px}
.empty .recent{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:var(--r);
  min-height:40px;padding:0 14px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--dim)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--text);font-weight:600;text-align:left;
  text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--text)}
.alert{border:1px solid #7f1d1d;background:#2a1215;color:#fecaca;border-radius:var(--r);padding:10px 14px;font-size:14px;margin:12px 0}

/* person heading */
.who{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px}
.who h2{font-family:var(--disp);font-size:26px;font-weight:700;margin:0;line-height:1.1}
.who .per{font-size:13px;color:var(--muted);text-align:right}

/* summary cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-width:0}
.card b{display:block;font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;line-height:1.1}
.card span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:4px}
.card.paid{border-color:rgba(45,212,191,.45);background:linear-gradient(180deg,rgba(45,212,191,.10),var(--panel) 70%)}
.card.paid b{color:var(--paid-ink)}
.card.routine{border-color:rgba(251,146,60,.45);background:linear-gradient(180deg,rgba(251,146,60,.10),var(--panel) 70%)}
.card.routine b{color:var(--routine-ink)}
.card.siph b{color:#7DD3FC}

/* stacked bar */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
.stack i{display:block;height:100%}
.stack i+i{box-shadow:inset 1px 0 0 rgba(14,21,31,.7)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--text);font-family:var(--disp);font-variant-numeric:tabular-nums}

/* breakdown list */
.bk-cat{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 6px;font-weight:600;font-size:14px}
.bk-cat.paid{color:var(--paid-ink)} .bk-cat.routine{color:var(--routine-ink)}
.bk-cat b{font-family:var(--disp);font-size:16px}
.bk-row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line-soft)}
.bk-row .dot{width:10px;height:10px;border-radius:50%}
.bk-row .lbl{font-size:14.5px}
.bk-row .codes{font-size:12px;color:var(--muted)}
.bk-row .n{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.bk-none{padding:6px 16px 12px;color:var(--muted);font-size:13px}

/* segmented control */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);min-height:38px;border-radius:7px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text)}

/* calendar */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 6px}
.calbar h3{font-family:var(--disp);font-size:17px;margin:0}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;width:40px;height:40px;
  display:grid;place-items:center;color:var(--text)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 8px 10px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .dow.we{color:var(--off)}
.cell{appearance:none;border:1px solid transparent;background:var(--panel-2);border-radius:8px;min-height:58px;padding:4px 3px 4px;
  display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0;color:var(--text)}
.cell .d{font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding-left:3px;line-height:1.2}
.cell.off{background:#18202D}
.cell.off .d{color:var(--off)}
.cell .hl{font-size:9.5px;color:var(--off);padding-left:3px;line-height:1}
.cell.has-paid{background:var(--paid-bg);border-color:rgba(45,212,191,.35)}
.cell.has-routine{background:var(--routine-bg);border-color:rgba(251,146,60,.4)}
.cell.has-paid.has-routine{background:linear-gradient(135deg,var(--paid-bg) 50%,var(--routine-bg) 50%)}
.cell[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:0}
.cell.blank{background:transparent;border:0;pointer-events:none}
.pill{display:block;font-size:10.5px;font-weight:600;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.paid{background:rgba(45,212,191,.25);color:#C9F7F0}
.pill.routine{background:rgba(251,146,60,.3);color:#FFE2C8}
.cal-key{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 12px;font-size:12.5px;color:var(--muted)}
.cal-key span{display:inline-flex;align-items:center;gap:6px}
.cal-key i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* day detail + list rows */
.dd{border-top:1px solid var(--line);padding:12px 16px}
.dd h4{margin:0 0 6px;font-family:var(--disp);font-size:16px}
.mhead{display:flex;justify-content:space-between;padding:10px 16px 6px;font-size:13px;color:var(--muted);font-weight:600;
  background:#121B27;border-top:1px solid var(--line-soft)}
.mhead:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-soft)}
.row.off{background:#131B26}
.row .date{text-align:center;line-height:1.1}
.row .date b{display:block;font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:20px}
.row .date small{font-size:11.5px;color:var(--muted)}
.row.off .date small{color:var(--off)}
.row .main{min-width:0}
.row .t1{font-size:14.5px;font-weight:600}
.row .t2{font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.paid{background:var(--paid-bg);color:var(--paid-ink);box-shadow:inset 0 0 0 1px rgba(45,212,191,.35)}
.badge.routine{background:var(--routine-bg);color:var(--routine-ink);box-shadow:inset 0 0 0 1px rgba(251,146,60,.4)}
.badge.unknown{background:var(--panel-2);color:var(--muted)}

/* year ribbons (signature) */
.year{padding:12px 14px 10px}
.yrow{appearance:none;border:0;background:transparent;width:100%;display:grid;grid-template-columns:40px 1fr 30px;gap:10px;
  align-items:center;padding:5px 2px;border-radius:7px;text-align:left}
.yrow:hover{background:var(--panel-2)}
.yrow .m{font-size:12.5px;color:var(--muted)}
.yrow .c{font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--muted)}
.ribbon{display:grid;gap:2px;align-items:end;height:24px}
.rc{height:5px;border-radius:2px;background:#223047}
.rc.off{background:#2A2533}
.rc.p{height:100%;background:var(--paid)}
.rc.r{height:100%;background:var(--routine)}
.rc.pr{height:100%;background:linear-gradient(180deg,var(--paid) 0 50%,var(--routine) 50% 100%)}

/* compare: metric rows */
.disc{border:1px solid var(--line);background:#121B27;border-radius:var(--r-lg);padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.disc b{color:var(--text)}
.mrow{padding:12px 16px;border-top:1px solid var(--line-soft)}
.mrow:first-child{border-top:0}
.mrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .top .l{font-size:14.5px;font-weight:600}
.mrow .top .v{font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.strip{position:relative;height:22px;margin:6px 0 4px}
.strip::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line);border-radius:1px}
.strip .dt{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--neutral);opacity:.45}
.strip .md{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--text);opacity:.8}
.strip .me{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;border:2px solid var(--ground)}
.facts{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--text);font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:600}

/* distribution */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
.tools .search{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:0 10px;min-height:40px}
.tools .search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.tools .search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;padding:6px 0}
.tools .search:focus-within{border-color:var(--focus)}
.dist{position:relative;padding:4px 0 8px}
.drow{display:grid;grid-template-columns:96px 1fr 58px;gap:10px;align-items:center;padding:5px 16px;min-height:38px}
.drow.me{background:rgba(125,211,252,.10);box-shadow:inset 3px 0 0 var(--focus)}
.drow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .nm .linkbtn{font-weight:500;text-decoration-color:transparent}
.drow .nm .linkbtn:hover{text-decoration-color:var(--dim)}
.drow.me .nm .linkbtn{font-weight:700}
.track{position:relative;height:14px;border-radius:4px;background:var(--panel-2);overflow:visible}
.track .bar{display:flex;height:100%;border-radius:4px;overflow:hidden}
.track .bar i{display:block;height:100%}
.track .medl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text);opacity:.5;border-radius:1px}
.drow .val{text-align:right;font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:600;line-height:1.15}
.drow .val small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.drow .val small .p{color:var(--paid-ink)} .drow .val small .r{color:var(--routine-ink)}
.dist-key{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 12px;font-size:12.5px;color:var(--muted)}
.dist-key span{display:inline-flex;align-items:center;gap:6px}
.dist-key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dist-key .ml{width:2px;height:14px;background:var(--text);opacity:.6;border-radius:1px}

/* multi-compare table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
table.cmp th,table.cmp td{padding:9px 10px;border-top:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;white-space:normal;min-width:120px}
table.cmp thead th{font-weight:700;border-top:0;font-family:var(--disp);font-size:14px;vertical-align:bottom}
table.cmp td{font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:16px}
table.cmp tr.paid td:first-child{color:var(--paid-ink)}
table.cmp tr.routine td:first-child{color:var(--routine-ink)}
table.cmp tr.sub td{font-size:14px;color:var(--muted)}
table.cmp tr.sub td:first-child{padding-left:22px;font-size:13px}
table.cmp td:first-child{font-family:var(--sans);font-size:13.5px}
table.cmp tr.strong td{font-weight:700}

/* type tab */
.grow{appearance:none;border:0;background:transparent;width:100%;display:grid;grid-template-columns:12px 1fr 1fr 48px;gap:10px;align-items:center;
  padding:9px 16px;border-top:1px solid var(--line-soft);text-align:left;color:var(--text)}
.grow[aria-pressed="true"]{background:var(--raise)}
.grow .dot{width:10px;height:10px;border-radius:50%}
.grow .lbl{font-size:14.5px}
.grow .tr{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.grow .tr i{display:block;height:100%;border-radius:4px}
.grow .n{text-align:right;font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:600}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line-soft)}
.prow .rk{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.prow .n{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;line-height:1.15}
.prow .n small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.prow.me{background:rgba(125,211,252,.10)}

/* day roster */
.ros{padding:4px 0 6px}
.ros-g{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:8px 16px;border-top:1px solid var(--line-soft);align-items:baseline}
.ros-g .g{font-size:13.5px;font-weight:600}
.ros-g .ppl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14.5px}

const MONTHS = [...new Set(REC.map(r => r[0]))].sort((a,b) => a-b);   // เดือนที่มีข้อมูลจริง

function emptyStat(){

          hol:{total:0, paid:0, routine:0, unknown:0, siphd:0, siphn:0, other:0, siriraj:0, cont:0},  // ส่วนที่ตรงวันหยุด

          byGroup:new Array(GROUPS.length).fill(0), byDuty:new Array(DUTYS.length).fill(0), byMonth:{},
          byGroupHol:new Array(GROUPS.length).fill(0), byDutyHol:new Array(DUTYS.length).fill(0)};
}
function addRecord(s, m, d, di){
  s.total++;
  s.byDuty[di]++;
  s.byMonth[m] = (s.byMonth[m] || 0) + 1;
  const off = isOff(m,d);
  if (off){ s.off++; s.hol.total++; s.byDutyHol[di]++; }
  const g = DUTY_GROUP[di];
  if (g < 0){ s.unknown++; if (off) s.hol.unknown++; return; }
  const G = GROUPS[g];
  s[G.cat]++; s[G.bucket]++; s.byGroup[g]++;
  if (off){ s.hol[G.cat]++; s.hol[G.bucket]++; s.byGroupHol[g]++; }
  if (G.bucket === "siriraj"){
    if (nextIsOff(m,d)) s.sr.preOff++; else s.sr.preWork++;
    if (dowOf(m,d) === 4) s.sr.thu++;
  }
}
const AGG = new Map();
function aggregate(period){
  if (AGG.has(period)) return AGG.get(period);
  const months = periodMonths(period), set = new Set(months);
  const per = NAMES.map(emptyStat), dept = emptyStat();
  for (const [m,d,di,ni] of REC){
    if (!set.has(m)) continue;
    addRecord(per[ni], m, d, di);
    addRecord(dept, m, d, di);
  }
  const res = {period, months, nMonths:months.length, per, dept};
  AGG.set(period, res);
  return res;
}

    const n = +(DUTYS[di].match(/\d+$/) || [0])[0];

            tot:s => s.byDutyHol[di], hol:s => s.byDutyHol[di]});

    L.push({id:g.id, label:g.label, cat:g.cat, color:g.hue, tot:s => s.byGroup[gi], hol:s => s.byGroupHol[gi]});
  });
  return L;
}

  ...ATOMS.filter(a => a.cat === "paid"),
  ...ATOMS.filter(a => a.cat === "routine"),
  {id:"contall", label:"ต่อเนื่องรวม", color:"var(--b-cont)", tot:s => s.cont, hol:s => s.hol.cont},
  {id:"total", label:"เวรทั้งหมด", color:"var(--neutral)", tot:s => s.total, hol:s => s.hol.total}
];
const metricById = id => METRICS.find(m => m.id === id) || METRICS[0];

function population(A, activeOnly){
  const idx = [];
  for (let i = 0; i < NAMES.length; i++) if (!activeOnly || A.per[i].total > 0) idx.push(i);
  return idx;
}
function describe(vals){
  const s = [...vals].sort((a,b) => a-b), n = s.length;
  if (!n) return {n:0, mean:0, median:0, min:0, max:0};
  const h = n >> 1;
  return {n, mean:s.reduce((a,v) => a+v, 0)/n, median: n % 2 ? s[h] : (s[h-1]+s[h])/2, min:s[0], max:s[n-1]};
}
const rankOf = (v, vals) => 1 + vals.filter(x => x > v).length;   // อันดับจากมากไปน้อย (เสมอกันได้อันดับเดียวกัน)

/* ตรวจความถูกต้องของผลรวมทุกครั้งที่โหลดหน้า */
function verify(){
  const errs = [];
  for (const p of ["all", ...MONTHS]){
    const A = aggregate(p), D = A.dept;
    const recN = REC.filter(r => A.months.includes(r[0])).length;
    if (D.total !== recN) errs.push(`${p}: total ${D.total} ≠ records ${recN}`);
    if (D.paid + D.routine + D.unknown !== D.total) errs.push(`${p}: paid+routine ≠ total`);
    if (D.siphd + D.siphn + D.other !== D.paid) errs.push(`${p}: SiPH+other ≠ paid`);
    if (D.siriraj + D.cont !== D.routine) errs.push(`${p}: siriraj+cont ≠ routine`);
    const sumPer = A.per.reduce((a,s) => a + s.total, 0);
    if (sumPer !== D.total) errs.push(`${p}: sum of people ≠ total`);
    if (D.hol.paid + D.hol.routine + D.hol.unknown !== D.hol.total) errs.push(`${p}: holiday split ≠ holiday total`);
    if (D.sr.preOff + D.sr.preWork !== D.siriraj) errs.push(`${p}: siriraj off split ≠ siriraj`);
    if (siphWeekday(D) + sumIdx(D.byDutyHol, SIPH_DAY) !== D.siphd) errs.push(`${p}: SiPH ในเวลา+วันหยุด ≠ SiPH กลางวัน`);
    if (D.byGroup.reduce((a,v) => a+v, 0) + D.unknown !== D.total) errs.push(`${p}: groups ≠ total`);
    if (ATOMS.reduce((a,x) => a + x.tot(D), 0) + D.unknown !== D.total) errs.push(`${p}: atoms ≠ total`);
    if (ATOMS.reduce((a,x) => a + x.hol(D), 0) + D.hol.unknown !== D.hol.total) errs.push(`${p}: atom holidays ≠ holidays`);
  }
  const monthSum = MONTHS.reduce((a,m) => a + aggregate(m).dept.total, 0);
  if (monthSum !== REC.length) errs.push(`sum of months ${monthSum} ≠ ${REC.length}`);
  return errs;
}

/* =====================================================================
   6) COMBOBOX (ใช้กับการเลือกชื่อหลัก และการเพิ่มชื่อเพื่อเปรียบเทียบ)
   ===================================================================== */
function makeCombo({input, list, onPick, showRecent=true, exclude=()=>[]}){
  let opts = [], active = -1;
  const open = () => { input.setAttribute("aria-expanded","true"); list.classList.remove("hidden"); };
  const close = () => { input.setAttribute("aria-expanded","false"); list.classList.add("hidden"); active = -1; input.removeAttribute("aria-activedescendant"); };
  function build(){
    const q = thNorm(input.value), ex = new Set(exclude());
    let html = "";
    opts = [];
    if (!q && showRecent && recent.length){
      const r = recent.map(n => NAMES.indexOf(n)).filter(i => i >= 0 && !ex.has(i));
      if (r.length){
        html += `<li class="grp" role="presentation">ดูล่าสุด</li>`;
        r.forEach(i => { html += optHTML(i, opts.length); opts.push(i); });
        html += `<li class="grp" role="presentation">ทั้งหมด</li>`;
      }
    }
    const all = NAMES.map((n,i) => i).filter(i => !ex.has(i) && (!q || thNorm(NAMES[i]).includes(q)));
    all.forEach(i => { html += optHTML(i, opts.length); opts.push(i); });
    if (!all.length) html += `<li class="none" role="presentation">ไม่พบชื่อ “${esc(input.value)}”</li>`;
    list.innerHTML = html;
    active = q && opts.length ? 0 : -1;
    paint();
  }
  function optHTML(i, k){
    const t = byPerson[i].length;
    return `<li role="option" id="${list.id}-o${k}" data-k="${k}" aria-selected="false">${esc(NAMES[i])}<small>${t} เวร</small></li>`;
  }
  function paint(){
    list.querySelectorAll("[role=option]").forEach(li => li.setAttribute("aria-selected", +li.dataset.k === active));
    if (active >= 0){
      const li = list.querySelector(`[data-k="${active}"]`);
      input.setAttribute("aria-activedescendant", li.id);
      li.scrollIntoView({block:"nearest"});
    } else input.removeAttribute("aria-activedescendant");
  }
  function pick(k){ const i = opts[k]; if (i == null) return; close(); onPick(i); }
  input.addEventListener("focus", () => { input.select(); build(); open(); });
  input.addEventListener("input", () => { build(); open(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ e.preventDefault(); if (list.classList.contains("hidden")){ build(); open(); } active = Math.min(opts.length-1, active+1); paint(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); active = Math.max(0, active-1); paint(); }
    else if (e.key === "Enter"){ if (active >= 0){ e.preventDefault(); pick(active); } }
    else if (e.key === "Escape"){ close(); input.blur(); }
  });
  list.addEventListener("mousedown", e => e.preventDefault());
  list.addEventListener("click", e => { const li = e.target.closest("[role=option]"); if (li) pick(+li.dataset.k); });
  input.addEventListener("blur", () => setTimeout(close, 120));
  return {close};
}

function setPerson(i, opts={}){
  state.person = i; state.calDay = null;
  const n = NAMES[i];
  recent = [n, ...recent.filter(x => x !== n)].slice(0,5);
  store.set("duty.recent", recent);
  if (opts.tab) setTab(opts.tab, false);
  syncContext(); render();
  if (opts.tab) window.scrollTo({top:0});
}
function setPeriod(p){
  state.period = p; state.calDay = null;
  if (p !== "all") state.calMonth = p;
  syncContext(); render();
}
function syncContext(){
  pinput.value = state.person == null ? "" : NAMES[state.person];
  $("#pclear").classList.toggle("hidden", state.person == null);
  const per = $("#periods");
  per.innerHTML = ["all", ...MONTHS].map(p =>
    `<button type="button" class="chip" data-p="${p}" aria-pressed="${p === state.period}" aria-label="${p === "all" ? "ทุกเดือน" : MTHL[p]}">${p === "all" ? "ทุกเดือน" : MTH[p]}</button>`).join("");
  const on = per.querySelector('[aria-pressed="true"]');
  if (on) on.scrollIntoView({block:"nearest", inline:"nearest"});
  $("#pcombo").classList.toggle("hidden", state.tab === "day" || state.tab === "type");
  per.classList.toggle("hidden", state.tab === "day");
  $("#ctx").classList.toggle("hidden", state.tab === "day");
}

   8) TABS

const TABS = ["person","day","stat","sr","type"];
function setTab(t, doRender=true){
  state.tab = t;
  TABS.forEach(x => {
    const on = x === t, b = $("#t-"+x);
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    $("#v-"+x).classList.toggle("hidden", !on);
  });
  if (doRender){ syncContext(); render(); window.scrollTo({top:0}); }
}
TABS.forEach((t,k) => {
  const b = $("#t-"+t);
  b.onclick = () => setTab(t);
  b.onkeydown = e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const n = TABS[(k + (e.key === "ArrowRight" ? 1 : TABS.length-1)) % TABS.length];
    setTab(n); $("#t-"+n).focus();
  };
});

function breakdownHTML(s, ni){
  if (!s.total) return `<div class="sec-h"><h2>แยกตามประเภทเวร</h2></div>
    <div class="panel pad note">ไม่มีเวรใน${state.period === "all" ? "ช่วงที่มีข้อมูล" : "เดือน" + MTHL[state.period]}</div>`;
  const bar = BUCKETS.map(b => s[b.id] ? `<i style="width:${pct(s[b.id], s.total)}%;background:${b.color}" title="${b.label} ${s[b.id]}"></i>` : "").join("");
  let h = `<div class="sec-h"><h2>แยกตามประเภทเวร</h2><span class="aside">เฉลี่ย ${f1(s.total / periodMonths(state.period).length)} เวร/เดือน${state.period === "all" ? ` (หาร ${MONTHS.length} เดือน)` : ""}</span></div>
  <div class="panel"><div class="pad"><div class="stack" role="img" aria-label="สัดส่วนประเภทเวร">${bar}</div>
    <div class="legend">${BUCKETS.map(b => `<span><i style="background:${b.color}"></i>${b.label} <b>${s[b.id]}</b></span>`).join("")}</div></div>`;
  for (const cat of ["paid","routine"]){
    h += `<div class="bk-cat ${cat}"><span>${CATS[cat].label}</span><b>${s[cat]}</b></div>`;
    const rows = GROUPS.map((g,gi) => [g,gi]).filter(([g,gi]) => g.cat === cat && s.byGroup[gi] > 0);
    if (!rows.length){ h += `<div class="bk-none">ไม่มี</div>`; continue; }
    for (const [g,gi] of rows){
      const codes = DUTYS.map((c,di) => [c,di]).filter(([c,di]) => DUTY_GROUP[di] === gi && s.byDuty[di] > 0);
      const codeTxt = codes.length > 1 || codes[0][0] !== g.label ? codes.map(([c,di]) => `${esc(c)} ×${s.byDuty[di]}`).join("  ") : "";
      h += `<div class="bk-row"><i class="dot" style="background:${g.hue}"></i>
        <div><div class="lbl">${g.label}</div>${codeTxt ? `<div class="codes">${codeTxt}</div>` : ""}</div>
        <div class="n">${s.byGroup[gi]}</div></div>`;
    }
  }
  if (s.unknown) h += `<div class="bk-cat"><span>${CATS.unknown.label}</span><b>${s.unknown}</b></div>`;
  return h + `</div>`;
}
function personMap(ni){
  const map = {};
  for (const [m,d,di] of byPerson[ni]) ((map[m] ||= {})[d] ||= []).push(di);
  return map;
}

      ${ds.map(di => `<span class="pill ${catOf(di)}">${esc(groupOf(di)?.short || DUTYS[di])}</span>`).join("")}</button>`;

  if (state.calDay && state.calDay.m === m){

        const mates = mateNames(m, d, di, ni);

  }

function personListHTML(ni){
  const map = personMap(ni);
  let h = `<div class="panel">`, any = false;
  for (const m of periodMonths(state.period)){
    const days = map[m];
    const cnt = days ? Object.values(days).reduce((a,v) => a + v.length, 0) : 0;
    if (!days && state.period === "all") continue;
    any = true;
    h += `<div class="mhead"><span>${MTHL[m]}</span><span>${cnt} เวร</span></div>`;
    if (!days){ h += `<div class="row"><div></div><div class="note">ไม่มีเวรเดือนนี้</div><div></div></div>`; continue; }
    for (const d of Object.keys(days).map(Number).sort((a,b) => a-b))
      for (const di of days[d]){
        const mates = mateNames(m, d, di, ni);
        h += `<div class="row ${isOff(m,d) ? "off" : ""}">
          <div class="date"><b>${d}</b><small>${DOW[dowOf(m,d)]}${isHol(m,d) ? " หยุด" : ""}</small></div>
          <div class="main"><div class="t1">${esc(groupOf(di)?.label || DUTYS[di])} <span class="t2">${esc(DUTYS[di])}</span></div>
            ${mates.length ? `<div class="t2">ร่วมกลุ่ม: ${mates.map(esc).join(", ")}</div>` : ""}</div>
          ${badge(di)}</div>`;
      }
  }
  if (!any) h += `<div class="pad note">ไม่มีเวรในช่วงที่มีข้อมูล</div>`;
  return h + `</div>`;
}
function personYearHTML(ni){
  const map = personMap(ni);
  let h = `<div class="panel"><div class="year">`;
  for (const m of MONTHS){
    const days = map[m] || {};
    let cells = "", c = 0;
    for (let d = 1; d <= ND[m]; d++){
      const ds = days[d] || []; c += ds.length;
      const p = ds.some(di => catOf(di) === "paid"), r = ds.some(di => catOf(di) === "routine");
      const cls = p && r ? "pr" : p ? "p" : r ? "r" : isOff(m,d) ? "off" : "";
      cells += `<div class="rc ${cls}" title="${d} ${MTH[m]}${ds.length ? " — " + ds.map(di => DUTYS[di]).join(", ") : ""}"></div>`;
    }
    h += `<button type="button" class="yrow" data-ymonth="${m}" aria-label="${MTHL[m]} ${c} เวร เปิดปฏิทินเดือนนี้">
      <span class="m">${MTH[m]}</span><span class="ribbon" style="grid-template-columns:repeat(${ND[m]},1fr)">${cells}</span><span class="c">${c}</span></button>`;
  }
  h += `</div><div class="cal-key">
    <span><i style="background:var(--paid)"></i>${CATS.paid.label}</span>
    <span><i style="background:var(--routine)"></i>${CATS.routine.label}</span>
    <span><i style="background:#2A2533"></i>วันหยุด</span><span>แตะเดือนเพื่อเปิดปฏิทิน</span></div></div>`;
  return h;
}
$("#v-person").addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v){ state.view = v.dataset.view; renderPerson(); return; }
  const st = e.target.closest("[data-calstep]");
  if (st){
    const cur = state.period === "all" ? state.calMonth : state.period;
    const nm = MONTHS[MONTHS.indexOf(cur) + +st.dataset.calstep];
    if (!nm) return;
    state.calDay = null;
    if (state.period === "all"){ state.calMonth = nm; renderPerson(); } else setPeriod(nm);
    return;
  }
  const c = e.target.closest("[data-cday]");
  if (c){
    const m = state.period === "all" ? state.calMonth : state.period, d = +c.dataset.cday;
    state.calDay = state.calDay && state.calDay.m === m && state.calDay.d === d ? null : {m,d};
    renderPerson();
    const dd = $("#dd"); if (dd) dd.scrollIntoView({block:"nearest", behavior:"smooth"});
    return;
  }
  const y = e.target.closest("[data-ymonth]");
  if (y){ state.view = "cal"; setPeriod(+y.dataset.ymonth); return; }
  const g = e.target.closest("[data-gotoday]");
  if (g){ const [m,d] = g.dataset.gotoday.split("-").map(Number); state.dayMonth = m; state.daySel = d; setTab("day"); }
});

/* =====================================================================
   10) RENDER: ตารางเวรรายวัน
   ===================================================================== */
function renderDay(){
  const m = state.dayMonth, d = Math.min(state.daySel, ND[m]);
  let h = `<div class="scroller" role="group" aria-label="เลือกเดือน" style="margin-bottom:12px">${MONTHS.map(x =>
    `<button type="button" class="chip" data-dmonth="${x}" aria-pressed="${x === m}" aria-label="${MTHL[x]}">${MTH[x]}</button>`).join("")}</div>
  <div class="panel"><div class="calbar"><h3 style="padding-left:6px">${MTHL[m]} ${YEAR_BE}</h3></div>
  <div class="cal" role="grid">${DOW.map((x,i) => `<div class="dow ${i === 0 || i === 6 ? "we" : ""}">${x}</div>`).join("")}
  ${`<div class="cell blank"></div>`.repeat(OFF[m])}`;
  for (let x = 1; x <= ND[m]; x++){
    const isToday = m === TODAY_M && x === TODAY_D;
    h += `<button type="button" class="cell daycell ${isOff(m,x) ? "off" : ""} ${isToday ? "today" : ""}" data-dday="${x}" aria-pressed="${x === d}"
      aria-label="${x} ${MTHL[m]}${isHol(m,x) ? " วันหยุดราชการ" : ""}${isToday ? " วันนี้" : ""}"><span class="d">${x}</span>${isHol(m,x) ? `<span class="hl">หยุด</span>` : ""}</button>`;
  }
  h += `</div></div>`;
  const on = byDay[m]?.[d] || [];
  const k = MONTHS.indexOf(m);
  const canPrev = !(k === 0 && d === 1), canNext = !(k === MONTHS.length-1 && d === ND[m]);
  h += `<div class="sec-h"><h2>${d} ${MTHL[m]} · วัน${DOWL[dowOf(m,d)]}</h2><span class="aside">${isHol(m,d) ? "วันหยุดราชการ" : isWknd(m,d) ? "วันหยุด" : ""}</span></div>
  <div class="panel"><div class="calbar">
    <button class="iconbtn" type="button" data-dstep="-1" aria-label="วันก่อนหน้า" ${canPrev ? "" : "disabled"}>${icon.prev}</button>
    <span class="note">${on.length} เวร</span>
    <button class="iconbtn" type="button" data-dstep="1" aria-label="วันถัดไป" ${canNext ? "" : "disabled"}>${icon.next}</button></div><div class="ros">`;
  if (!on.length) h += `<div class="pad note">ไม่มีเวรในข้อมูลวันนี้</div>`;
  for (const cat of ["paid","routine","unknown"]){
    const items = on.filter(([di]) => catOf(di) === cat);
    if (!items.length) continue;
    h += `<div class="bk-cat ${cat}"><span>${CATS[cat].label}</span><b>${items.length}</b></div>`;
    const gs = [...new Set(items.map(([di]) => DUTY_GROUP[di]))];
    for (const g of gs){
      const its = items.filter(([di]) => DUTY_GROUP[di] === g);
      h += `<div class="ros-g"><div class="g">${g >= 0 ? GROUPS[g].label : "อื่นๆ"}</div><div class="ppl">${its.map(([di,ni]) =>
        `<span>${its.length > 1 || (g >= 0 && GROUPS[g].label !== DUTYS[di]) ? `<small>${esc(DUTYS[di])}</small>` : ""}${nameBtn(ni)}</span>`).join("")}</div></div>`;
    }
  }
  $("#v-day").innerHTML = h + `</div></div>`;
  const on2 = $("#v-day [data-dmonth][aria-pressed=true]"); if (on2) on2.scrollIntoView({block:"nearest", inline:"center"});
}
$("#v-day").addEventListener("click", e => {
  const mm = e.target.closest("[data-dmonth]");
  if (mm){ state.dayMonth = +mm.dataset.dmonth; state.daySel = Math.min(state.daySel, ND[state.dayMonth]); renderDay(); return; }
  const dd = e.target.closest("[data-dday]");
  if (dd){ state.daySel = +dd.dataset.dday; renderDay(); return; }
  const st = e.target.closest("[data-dstep]");
  if (st){
    let m = state.dayMonth, d = state.daySel + +st.dataset.dstep;
    if (d < 1){ const pm = MONTHS[MONTHS.indexOf(m)-1]; if (!pm) return; m = pm; d = ND[pm]; }
    if (d > ND[m]){ const nm = MONTHS[MONTHS.indexOf(m)+1]; if (!nm) return; m = nm; d = 1; }
    state.dayMonth = m; state.daySel = d; renderDay();
  }
});

/* =====================================================================
   11) RENDER: สถิติเปรียบเทียบ
   ส่วนบน: เลือกชนิดเวรได้หลายชนิด แล้วรวมนับ เรียงทุกคนในภาค
   ส่วนล่าง: คนที่เลือก เทียบค่าเฉลี่ย ทีละชนิดเวร
   ===================================================================== */
const DAYTYPES = [["all","ทุกวัน"],["wd","วันธรรมดา"],["off","วันหยุด"]];
/* แสดง "หยุด X" เฉพาะประเภทที่มีทั้งวันธรรมดาและวันหยุดในข้อมูล */
const mixedDays = (M, D) => M.hol(D) > 0 && M.hol(D) < M.tot(D);
const valOf = (s, M, dt) => dt === "off" ? M.hol(s) : dt === "wd" ? M.tot(s) - M.hol(s) : M.tot(s);
const HOL_FILL = "repeating-linear-gradient(135deg,var(--off) 0 3px,rgba(245,163,183,.55) 3px 6px)";
const PRESETS = [
  ["paid",    "เวรพิเศษทั้งหมด", a => a.cat === "paid"],
  ["routine", CATS.routine.label, a => a.cat === "routine"],
  ["all",     "ทุกชนิด",         () => true],
  ["none",    "ล้าง",            () => false]
];
const selMetric = () => {
  const on = ATOMS.filter(a => state.sel.has(a.id));
  return {tot:s => on.reduce((x,a) => x + a.tot(s), 0), hol:s => on.reduce((x,a) => x + a.hol(s), 0), on};
};
function selName(on){
  for (const [k,l,f] of PRESETS){
    const ids = ATOMS.filter(f).map(a => a.id);
    if (k !== "none" && ids.length === on.length && ids.every(id => state.sel.has(id))) return l;
  }
  return on.map(a => a.label).join(" + ");
}
function splitBar(wd, off, max, color){
  return `<div class="track"><div class="bar"><i style="width:${pct(wd,max)}%;background:${color}"></i><i style="width:${pct(off,max)}%;background:${HOL_FILL}"></i></div></div>`;
}
function renderStat(){
  const A = aggregate(state.period);
  const pop = population(A, true);
  const doers = M => pop.filter(i => M.tot(A.per[i]) > 0);
  const avg = (M, dt) => { const g = doers(M); return g.length ? g.reduce((a,i) => a + valOf(A.per[i], M, dt), 0) / g.length : 0; };

  let h = `<div class="disc">นับจากเวรที่ลงจริง ยังไม่ได้ปรับตามสิทธิ์การลงเวร ความพร้อม หรือโควตาของแต่ละคน
    ใช้ดูภาพรวมเท่านั้น ไม่ได้บอกว่าใครได้มากหรือน้อยเกินควร</div>
  <div class="dist-key" style="padding:12px 2px 0">
    <span><i style="background:var(--paid)"></i>วันธรรมดา</span>
    <span><i style="background:${HOL_FILL}"></i>วันหยุด (ส–อา และวันหยุดราชการ)</span></div>`;

  /* ---- ส่วนบน: เลือกชนิดเวรที่จะนับ ---- */
  const S = selMetric(), dt = state.dayType;
  const chipsOf = cat => ATOMS.filter(a => a.cat === cat).map(a =>
    `<button type="button" class="chip sm" data-atom="${a.id}" aria-pressed="${state.sel.has(a.id)}">${a.label}</button>`).join("");
  h += `<div class="sec-h"><h2>นับเวรตามชนิดที่เลือก</h2><span class="aside">${periodShort(state.period)}</span></div>
  <div class="panel">
    <div class="pick">
      <div class="pick-h">เลือกเร็ว</div>
      <div class="pick-row">${PRESETS.map(([k,l]) => `<button type="button" class="btn sm" data-preset="${k}">${l}</button>`).join("")}</div>
      <div class="pick-h paid">${CATS.paid.label}</div>
      <div class="pick-row">${chipsOf("paid")}</div>
      <div class="pick-h routine">${CATS.routine.label}</div>
      <div class="pick-row">${chipsOf("routine")}</div>
    </div>
    <div class="tools" style="padding-top:4px">
      <div class="seg" role="group" aria-label="ประเภทวัน" style="flex:1 1 220px">${DAYTYPES.map(([k,l]) =>
        `<button type="button" data-daytype="${k}" aria-pressed="${k === dt}">${l}</button>`).join("")}</div>
      <button type="button" class="btn" data-sort aria-label="สลับการเรียงลำดับ">${state.sortDesc ? "มาก → น้อย" : "น้อย → มาก"}</button>
    </div>`;
  if (!S.on.length){
    h += `<div class="pad note" style="border-top:1px solid var(--line-soft)">เลือกชนิดเวรอย่างน้อย 1 ชนิด</div></div>`;
  } else {
    const grp = doers(S);
    let rows = grp.map(i => [i, valOf(A.per[i], S, dt)]);
    rows.sort((a,b) => state.sortDesc ? b[1]-a[1] || a[0]-b[0] : a[1]-b[1] || a[0]-b[0]);
    const max = Math.max(...rows.map(r => r[1]), 1);
    const deptN = valOf(A.dept, S, dt);
    const mx = mixedDays(S, A.dept);
    const color = S.on.every(a => a.cat === "routine") ? "var(--routine)" : S.on.length === 1 ? S.on[0].color : "var(--paid)";
    const vals = grp.map(i => valOf(A.per[i], S, dt));
    let who = "";
    if (state.person != null){
      const v = valOf(A.per[state.person], S, dt);
      who = grp.includes(state.person)
        ? `<b>${esc(NAMES[state.person])}</b> ได้ <b>${v}</b> เวร ลำดับที่ <b>${rankOf(v, vals)}</b> จาก ${grp.length} คน (มาก→น้อย)`
        : `<b>${esc(NAMES[state.person])}</b> ไม่มีเวรชนิดที่เลือกในช่วงนี้`;
    }
    h += `<div class="selsum"><div>นับ ${selName(S.on)}${dt === "all" ? "" : ` · เฉพาะ${dt === "wd" ? "วันธรรมดา" : "วันหยุด"}`}</div>
      <div>รวมทั้งภาค <b>${deptN.toLocaleString()}</b> เวร · ${grp.length} คน</div>${who ? `<div>${who}</div>` : ""}</div>
    <div class="note" style="padding:8px 16px 4px">แตะชื่อเพื่อเปิดตารางของคนนั้น</div><div class="dist">`;
    for (const [i,v] of rows){
      const s = A.per[i], hv = S.hol(s), wv = S.tot(s) - hv;
      const bar = dt === "all" ? splitBar(wv, hv, max, color)
        : `<div class="track"><div class="bar"><i style="width:${pct(v,max)}%;background:${dt === "off" ? HOL_FILL : color}"></i></div></div>`;
      h += `<div class="drow ${i === state.person ? "me" : ""}"><div class="nm">${nameBtn(i)}</div>${bar}
        <div class="val">${v}${dt === "all" && mx ? `<small>หยุด ${hv}</small>` : ""}</div></div>`;
    }
    h += `</div></div>`;
  }

  /* ---- ส่วนล่าง: คนที่เลือก เทียบค่าเฉลี่ย ---- */
  if (state.person == null){
    h += `<div class="sec-h"><h2>รายคน เทียบค่าเฉลี่ย</h2></div>
      <div class="empty">เลือกชื่ออาจารย์ในช่องด้านบน เพื่อดูตัวเลขเทียบกับค่าเฉลี่ยของภาค</div>`;
  } else {
    const ni = state.person, s = A.per[ni], nm = esc(NAMES[ni]);
    h += `<div class="sec-h"><h2>${nm} เทียบค่าเฉลี่ย</h2></div><div class="panel">`;
    for (const M of METRICS){
      if (!doers(M).length && !M.tot(s)) continue;    // ไม่มีใครลงเวรชนิดนี้ในช่วงที่เลือก
      const me = [M.tot(s) - M.hol(s), M.hol(s)];
      const av = [avg(M,"wd"), avg(M,"off")], mx = mixedDays(M, A.dept);
      const max = Math.max(me[0]+me[1], av[0]+av[1], 1);
      h += `<div class="cmpm"><div class="l">${M.label}</div>
        <div class="pb"><span class="w" title="${nm}">${nm}</span>${splitBar(me[0], me[1], max, M.color)}
          <span class="v"><b>${me[0]+me[1]}</b>${mx ? `<small>หยุด ${me[1]}</small>` : ""}</span></div>
        <div class="pb avg"><span class="w">เฉลี่ย<small>${doers(M).length} คน</small></span>${splitBar(av[0], av[1], max, M.color)}
          <span class="v"><b>${(av[0]+av[1]).toFixed(1)}</b>${mx ? `<small>หยุด ${av[1].toFixed(1)}</small>` : ""}</span></div></div>`;
    }
    h += `<div class="pad note" style="border-top:1px solid var(--line-soft)">ค่าเฉลี่ยคิดจากอาจารย์ที่มีเวรชนิดนั้นในช่วงที่เลือก (จำนวนคนอยู่ใต้คำว่าเฉลี่ย)</div></div>`;
  }
  $("#v-stat").innerHTML = h;
}
$("#v-stat").addEventListener("click", e => {
  const a = e.target.closest("[data-atom]");
  if (a){ const id = a.dataset.atom; state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); renderStat(); return; }
  const p = e.target.closest("[data-preset]");
  if (p){ const f = PRESETS.find(x => x[0] === p.dataset.preset)[2]; state.sel = new Set(ATOMS.filter(f).map(x => x.id)); renderStat(); return; }
  const d = e.target.closest("[data-daytype]");
  if (d){ state.dayType = d.dataset.daytype; renderStat(); return; }
  if (e.target.closest("[data-sort]")){ state.sortDesc = !state.sortDesc; renderStat(); }
});

/* =====================================================================
   11b) RENDER: เวรศิริราช (ได้ off / ไม่ได้ off / วันพฤหัส)
   ได้ off    = วันรุ่งขึ้นเป็นวันทำงาน
   ไม่ได้ off = วันรุ่งขึ้นเป็นเสาร์ อาทิตย์ หรือวันหยุดราชการ (คืนศุกร์ เสาร์ และคืนก่อนวันหยุด)
   ===================================================================== */
const SR_COLS = [["total","รวม"],["preWork","ได้ off"],["preOff","ไม่ได้ off"],["thu","วันพฤ"]];
const srVal = (s, k) => k === "total" ? s.siriraj : s.sr[k];
function renderSiriraj(){
  const A = aggregate(state.period), D = A.dept;
  let h = `<div class="who" style="margin-top:4px"><h2>เวรศิริราช</h2><div class="per">${periodLabel(state.period)}</div></div>
  <div class="cards">
    <div class="card routine"><b>${D.siriraj}</b><span>เวรศิริราชทั้งหมด</span></div>
    <div class="card"><b>${D.sr.preWork}</b><span>ได้ off<br>วันรุ่งขึ้นเป็นวันทำงาน</span></div>
    <div class="card"><b>${D.sr.preOff}</b><span>ไม่ได้ off<br>วันรุ่งขึ้นเป็นวันหยุด</span></div>
    <div class="card"><b>${D.sr.thu}</b><span>เวรวันพฤหัส</span></div>
  </div>
  <div class="note" style="margin:10px 2px 0">“ไม่ได้ off” คือคืนศุกร์ คืนเสาร์ และคืนก่อนวันหยุดราชการ ส่วน “วันพฤ” นับทุกวันพฤหัส
    รวมวันพฤหัสที่ตรงหรือติดวันหยุดด้วย</div>`;
  const rows = NAMES.map((n,i) => i).filter(i => A.per[i].siriraj > 0);
  const k = state.srSort, dir = state.srDesc ? -1 : 1;
  rows.sort((a,b) => dir * (srVal(A.per[a],k) - srVal(A.per[b],k)) || A.per[b].siriraj - A.per[a].siriraj || a-b);
  h += `<div class="sec-h"><h2>รายคน</h2><span class="aside">${rows.length} คน · แตะหัวคอลัมน์เพื่อเรียง</span></div>
  <div class="panel">`;
  if (!rows.length) h += `<div class="pad note">ไม่มีเวรศิริราชในช่วงที่เลือก</div>`;
  else {
    h += `<div class="tbl-wrap"><table class="cmp srt"><thead><tr><th scope="col">ชื่อ</th>${SR_COLS.map(([c,l]) => {
      const on = c === k;
      return `<th scope="col" aria-sort="${on ? (state.srDesc ? "descending" : "ascending") : "none"}">
        <button type="button" class="sortbtn ${on ? "on" : ""}" data-srsort="${c}">${l}${on ? (state.srDesc ? " ↓" : " ↑") : ""}</button></th>`;
    }).join("")}</tr></thead><tbody>`;
    for (const i of rows){
      const s = A.per[i];
      h += `<tr class="${i === state.person ? "me" : ""}"><td>${nameBtn(i)}</td>
        <td>${s.siriraj}</td><td>${s.sr.preWork}</td><td class="hot">${s.sr.preOff}</td><td>${s.sr.thu}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  $("#v-sr").innerHTML = h + `</div>`;
}
$("#v-sr").addEventListener("click", e => {
  const b = e.target.closest("[data-srsort]"); if (!b) return;
  const c = b.dataset.srsort;
  if (c === state.srSort) state.srDesc = !state.srDesc; else { state.srSort = c; state.srDesc = true; }
  renderSiriraj();
});

/* =====================================================================
   12) RENDER: เวรแยกตามประเภท
   ===================================================================== */
function renderType(){
  const A = aggregate(state.period), D = A.dept;
  const gi = state.group, G = GROUPS[gi];
  const maxG = Math.max(...D.byGroup, 1);
  let h = `<div class="sec-h" style="margin-top:4px"><h2>จำนวนเวรแต่ละประเภท</h2><span class="aside">${periodLabel(state.period)}</span></div><div class="panel">`;
  for (const cat of ["paid","routine"]){
    h += `<div class="bk-cat ${cat}"><span>${CATS[cat].label}</span><b>${D[cat].toLocaleString()}</b></div>`;
    GROUPS.forEach((g,k) => {
      if (g.cat !== cat) return;
      h += `<button type="button" class="grow" data-group="${k}" aria-pressed="${k === gi}">
        <i class="dot" style="background:${g.hue}"></i><span class="lbl">${g.label}</span>
        <span class="tr"><i style="width:${pct(D.byGroup[k], maxG)}%;background:${g.hue}"></i></span><span class="n">${D.byGroup[k]}</span></button>`;
    });
  }
  h += `</div>`;

  const codes = DUTYS.map((c,di) => [c,di]).filter(([c,di]) => DUTY_GROUP[di] === gi);
  const code = codes.some(([c,di]) => di === state.groupCode) ? state.groupCode : null;
  const match = di => code == null ? DUTY_GROUP[di] === gi : di === code;
  const cnt = NAMES.map(() => [0,0]);   // [ทั้งหมด, วันหยุด]
  for (const [m,d,di,ni] of REC){
    if (!A.months.includes(m) || !match(di)) continue;
    cnt[ni][0]++; if (isOff(m,d)) cnt[ni][1]++;
  }
  const rows = cnt.map((c,i) => [i,...c]).filter(r => r[1] > 0).sort((a,b) => b[1]-a[1] || a[0]-b[0]);
  const total = rows.reduce((a,r) => a + r[1], 0);
  h += `<div class="sec-h"><h2>${G.label}</h2><span class="aside">${total} เวร · ${rows.length} คน</span></div><div class="panel">`;
  if (codes.length > 1) h += `<div class="tools"><div class="scroller" role="group" aria-label="ตำแหน่งย่อย" style="margin:0 -16px;width:calc(100% + 32px)">
    <button type="button" class="chip" data-code="" aria-pressed="${code == null}">ทุกตำแหน่ง</button>${codes.map(([c,di]) =>
      `<button type="button" class="chip" data-code="${di}" aria-pressed="${di === code}">${esc(c)}</button>`).join("")}</div></div>`;
  h += `<div class="note" style="padding:4px 16px 8px">ตัวเลขเล็กใต้จำนวน = ส่วนที่ตรงกับเสาร์–อาทิตย์หรือวันหยุดราชการ · แตะชื่อเพื่อเปิดตาราง</div>`;
  if (!rows.length) h += `<div class="pad note">ไม่มีเวรประเภทนี้ในช่วงที่เลือก</div>`;
  let rk = 0, prev = null;
  rows.forEach(([i,n,off], k) => {
    if (n !== prev){ rk = k+1; prev = n; }
    h += `<div class="prow ${i === state.person ? "me" : ""}"><span class="rk">${rk}</span><div>${nameBtn(i)}</div>
      <div class="n">${n}<small>วันหยุด ${off}</small></div></div>`;
  });
  $("#v-type").innerHTML = h + `</div>`;
}
$("#v-type").addEventListener("click", e => {
  const g = e.target.closest("[data-group]");
  if (g){ state.group = +g.dataset.group; state.groupCode = null; renderType(); return; }
  const c = e.target.closest("[data-code]");
  if (c){ state.groupCode = c.dataset.code === "" ? null : +c.dataset.code; renderType(); }
});

/* =====================================================================
   13) INIT
   ===================================================================== */
function render(){
  if (state.tab === "person") renderPerson();
  else if (state.tab === "day") renderDay();
  else if (state.tab === "stat") renderStat();
  else if (state.tab === "sr") renderSiriraj();
  else renderType();
}
(function init(){
  const span = MONTHS.length > 1 ? `${MTHL[MONTHS[0]]} – ${MTHL[LAST_M]} ${YEAR_BE}` : `${MTHL[LAST_M]} ${YEAR_BE}`;
  $("#coverage").textContent = `ข้อมูล ${span} (${MONTHS.length} เดือน)${LAST_M < 12 ? ` ยังไม่มีข้อมูลหลัง${MTHL[LAST_M]}` : ""}`;
  $("#foot").innerHTML = `ข้อมูลเวร ${REC.length.toLocaleString()} รายการ อาจารย์ ${NAMES.length} คน ตำแหน่งเวร ${DUTYS.length} ตำแหน่ง ·
    วันหยุด = เสาร์ อาทิตย์ และวันหยุดราชการ (รวมวันหยุดชดเชยและวันหยุดพิเศษ ไม่นับวันแรงงาน 1 พ.ค.) ·
    ${CATS.paid.label}: SiPH, Scope, General, Orthopedic, Float, ENT, Gynecology, Neuro, Thoracic ·
    ${CATS.routine.label}: เวรศิริราช ต่อเนื่อง3 ต่อเนื่องสูติ`;
  const errs = verify();
  let al = "";
  if (UNMAPPED.length) al += `<div class="alert">มีตำแหน่งเวรที่ยังไม่ได้จัดประเภท: ${UNMAPPED.map(esc).join(", ")} — เพิ่มกฎใน GROUPS ก่อนใช้ตัวเลขเปรียบเทียบ</div>`;
  if (errs.length){ al += `<div class="alert">ผลรวมไม่ตรงกัน: ${errs.map(esc).join("; ")}</div>`; console.error(errs); }
  $("#alerts").innerHTML = al;
  setTab("person", false);
  syncContext(); render();
})();
</script>
</body>
